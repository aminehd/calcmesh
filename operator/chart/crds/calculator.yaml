# Teaches the cluster a new word, "Calculator". Helm installs everything in
# crds/ before the templates, so the Calculator objects can be created after it.

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: calculators.calcmesh.io
spec:
  group: calcmesh.io
  names:
    kind: Calculator
    listKind: CalculatorList 
    plural: calculators
    singular: calculator
  scope: Namespaced 
  versions:
    - name: v1
      served: true
      storage: true
      # Lets the controller write .status separately from .spec,
      # (kubebuilder writes this as //+kubebuilder:subresource:status).
      subresources:
        status: {}
      # The shape of a Calculator. The API server rejects anything else.
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [op]
              properties:
                op:
                  type: string
                  enum: [addition, subtraction, multiplication, division, modulo]
                replicas:
                  type: integer
                  minimum: 1
                  default: 1
            status:
              type: object
              properties:
                ready:
                  type: boolean
                message:
                  type: string
      # Extra columns shown by `kubectl get calc`.
      additionalPrinterColumns:
        - name: Op
          type: string
          jsonPath: .spec.op
        - name: Ready
          type: boolean
          jsonPath: .status.ready
